name: Build Additional Platforms
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Reviewed source tag or commit'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run check:release && npm test
      - run: npm run tauri:build -- --ci --no-sign --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Record checksums, source and license notices
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          node scripts/installer-checksums.mjs src-tauri/target/${{ matrix.target }}/release/bundle
          cp LICENSE ATTRIBUTION.md src-tauri/target/${{ matrix.target }}/release/bundle/
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const root=`src-tauri/target/${process.env.TARGET}/release/bundle`;
          fs.writeFileSync(`${root}/BUILD_PROVENANCE.json`,JSON.stringify({version:JSON.parse(fs.readFileSync('package.json','utf8')).version,sourceCommit:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),sourceRef:process.env.SOURCE_REF,target:process.env.TARGET,signed:false,deviceAcceptance:false,runUrl:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: mermaider-additional-${{ matrix.target }}-${{ inputs.source_ref }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/SHA256SUMS.txt
            src-tauri/target/${{ matrix.target }}/release/bundle/BUILD_PROVENANCE.json
            src-tauri/target/${{ matrix.target }}/release/bundle/LICENSE
            src-tauri/target/${{ matrix.target }}/release/bundle/ATTRIBUTION.md
          if-no-files-found: error
          retention-days: 30
