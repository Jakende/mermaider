name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-web:
    uses: ./.github/workflows/build-web.yml

  prepare-release:
    needs: verify-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm run check:release
      - name: Create or reuse draft once
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            let release = releases.find(item => item.tag_name === tag);
            if (release && !release.draft) throw new Error('Published release exists; use a new version tag.');
            if (!release) {
              release = (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: `Release ${tag}`, draft: true,
                body: 'Release candidate. Native smoke tests and signing checks are required before publication.'
              })).data;
            }
            core.setOutput('id', release.id);

  build-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg -- --locked'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc --bundles nsis -- --locked'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run check:release
      - run: npm run lint
      - run: npm test
      - name: Check native code against lockfile
        run: cargo check --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_BACKTRACE: 1
        with:
          projectPath: ./
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          args: ${{ matrix.args }}
      - name: Verify installer
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$PLATFORM" == macos-* ]]; then
            find src-tauri/target/${{ matrix.target }}/release/bundle -name '*.dmg' -print -quit | grep .
          else
            find src-tauri/target/${{ matrix.target }}/release/bundle -name '*.exe' -print -quit | grep .
          fi
