name: Build Signed Installers
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Reviewed release tag; certificates must already be configured'
        required: true
        type: string
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Require signing credentials
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing secret: $name"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install certificate in temporary keychain
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
      - run: npm ci && npm run check:release && npm test
      - run: npm run tauri:build -- --ci --target aarch64-apple-darwin --bundles app,dmg -- --locked
      - name: Verify signature and notarization
        run: |
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -name '*.app' -prune -print -quit)
          test -n "$APP"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute --verbose "$APP"
          xcrun stapler validate "$APP"
          node scripts/installer-checksums.mjs src-tauri/target/aarch64-apple-darwin/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: mermaider-signed-macos-${{ inputs.source_ref }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12"
  windows:
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Require signing credentials
        shell: pwsh
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Configure WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD first.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Import certificate and prepare signing configuration
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'https://timestamp.digicert.com' } } }
          $config | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP 'signing.json')
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - shell: pwsh
        run: npm run tauri:build -- --ci --config "$env:RUNNER_TEMP/signing.json" --bundles nsis -- --locked
      - name: Verify Authenticode
        shell: pwsh
        run: |
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if (!$files) { throw 'No installer produced.' }
          foreach ($file in $files) { if ((Get-AuthenticodeSignature $file.FullName).Status -ne 'Valid') { throw 'Installer signature invalid.' } }
          node scripts/installer-checksums.mjs src-tauri/target/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: mermaider-signed-windows-${{ inputs.source_ref }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - if: always()
        shell: pwsh
        run: |
          Remove-Item "$env:RUNNER_TEMP/signing.pfx" -ErrorAction SilentlyContinue
          Remove-Item "$env:RUNNER_TEMP/signing.json" -ErrorAction SilentlyContinue
